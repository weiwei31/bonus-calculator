<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>官網紅利點數計算機</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .calculator-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      margin-top: 0;
      color: var(--primary-color);
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }

    .result-box {
      margin-top: 25px;
      padding: 15px;
      background-color: #eef2ff;
      border-radius: 8px;
      border-left: 4px solid var(--primary-color);
    }

    .result-item {
      margin-bottom: 10px;
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-label {
      font-size: 0.85rem;
      color: #4b5563;
    }

    .result-value {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary-color);
    }
  </style>
</head>
<body>

<div class="calculator-card">
  <h2>紅利點數試算機</h2>
  
  <div class="form-group">
    <label for="rewardRate">紅利回饋比例 (%)</label>
    <input type="number" id="rewardRate" value="5" min="0" step="0.1" oninput="calculate()">
  </div>

  <div class="form-group">
    <label for="maxDiscountRate">單筆折抵上限 (%)</label>
    <input type="number" id="maxDiscountRate" value="20" min="0" max="100" step="0.1" oninput="calculate()">
  </div>

  <div class="form-group">
    <label for="orderAmount">當前訂單金額 ($)</label>
    <input type="number" id="orderAmount" value="1000" min="0" step="1" oninput="calculate()">
  </div>

  <div class="result-box">
    <div class="result-item">
      <div class="result-label">本筆訂單可獲得紅利：</div>
      <div class="result-value" id="earnedPoints">0 點</div>
    </div>
    <div class="result-item" style="margin-top: 15px;">
      <div class="result-label">下一筆全額折抵該紅利所需最低消費：</div>
      <div class="result-value" id="minNextOrder">NT$ 0</div>
    </div>
  </div>
</div>

<script>
  function calculate() {
    const rewardRate = parseFloat(document.getElementById('rewardRate').value) || 0;
    const maxDiscountRate = parseFloat(document.getElementById('maxDiscountRate').value) || 0;
    const orderAmount = parseFloat(document.getElementById('orderAmount').value) || 0;

    // 計算獲得點數 (無條件捨去小數點)
    const earnedPoints = Math.floor(orderAmount * (rewardRate / 100));
    
    // 計算下一筆最低消費： 點數 / (折抵上限 %)
    let minNextOrder = 0;
    if (maxDiscountRate > 0) {
      minNextOrder = Math.ceil(earnedPoints / (maxDiscountRate / 100));
    }

    // 渲染結果
    document.getElementById('earnedPoints').innerText = `${earnedPoints.toLocaleString()} 點`;
    document.getElementById('minNextOrder').innerText = `NT$ ${minNextOrder.toLocaleString()}`;
  }

  // 初始化計算
  calculate();
</script>

</body>
</html>
