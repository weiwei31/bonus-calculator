<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紅利點數計算機</title>
  <style>
    :root {
      --primary-color: #26C6B6;
      --primary-dark: #1ea89a;
      --primary-light: #e6f9f7;
      --bg-color: #f0f7f6;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --border-color: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .calculator-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(38, 198, 182, 0.15);
      width: 100%;
      max-width: 480px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--primary-dark);
      text-align: center;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-dark);
      border-left: 4px solid var(--primary-color);
      padding-left: 8px;
      margin-bottom: 15px;
    }

    .section-block {
      background-color: #fafafa;
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #4a5568;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1.5px solid #cbd5e0;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
      background-color: #fff;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(38, 198, 182, 0.25);
    }

    .result-box {
      margin-top: 15px;
      padding: 15px;
      background-color: var(--primary-light);
      border-radius: 8px;
    }

    .result-item {
      margin-bottom: 10px;
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-label {
      font-size: 0.85rem;
      color: #718096;
    }

    .result-value {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>

<div class="calculator-card">
  <h2>紅利點數計算機</h2>
  
  <div class="section-block">
    <div class="section-title">第一區：系統規則設定</div>
    <div class="form-group">
      <label for="rewardRate">紅利回饋比例 (%)</label>
      <input type="number" id="rewardRate" value="5" min="0" step="0.1" oninput="calculate()">
    </div>
    <div class="form-group">
      <label for="maxDiscountRate">單筆折抵上限 (%)</label>
      <input type="number" id="maxDiscountRate" value="20" min="0" max="100" step="0.1" oninput="calculate()">
    </div>
  </div>

  <div class="section-block">
    <div class="section-title">第二區：訂單試算與結果</div>
    <div class="form-group">
      <label for="orderAmount">當前訂單金額 ($)</label>
      <input type="number" id="orderAmount" value="1000" min="0" step="1" oninput="calculate()">
    </div>
    <div class="form-group">
      <label for="discountAmount">使用紅利折抵金額 ($)</label>
      <input type="number" id="discountAmount" value="0" min="0" step="1" oninput="calculate()">
    </div>

    <div class="result-box">
      <div class="result-item">
        <div class="result-label">本筆訂單可獲得紅利：</div>
        <div class="result-value" id="earnedPoints">0 點</div>
      </div>
      <div class="result-item" style="margin-top: 12px;">
        <div class="result-label">下一筆全額折抵該紅利所需最低消費：</div>
        <div class="result-value" id="minNextOrder">NT$ 0</div>
      </div>
    </div>
  </div>
</div>

<script>
  function calculate() {
    const rewardRate = parseFloat(document.getElementById('rewardRate').value) || 0;
    const maxDiscountRate = parseFloat(document.getElementById('maxDiscountRate').value) || 0;
    const orderAmount = parseFloat(document.getElementById('orderAmount').value) || 0;
    const discountAmount = parseFloat(document.getElementById('discountAmount').value) || 0;

    // 計算實際可計點的金額：當前金額 - 折抵金額 (若小於 0 則計為 0)
    const netAmount = Math.max(0, orderAmount - discountAmount);

    // 獲得紅利點數 = (當前訂單金額 - 折抵金額) * 紅利%，無條件捨去
    const earnedPoints = Math.floor(netAmount * (rewardRate / 100));
    
    // 下一筆最低消費 = 獲得點數 / 折抵上限%，無條件進位
    let minNextOrder = 0;
    if (maxDiscountRate > 0) {
      minNextOrder = Math.ceil(earnedPoints / (maxDiscountRate / 100));
    }

    // 渲染結果
    document.getElementById('earnedPoints').innerText = `${earnedPoints.toLocaleString()} 點`;
    document.getElementById('minNextOrder').innerText = `NT$ ${minNextOrder.toLocaleString()}`;
  }

  // 初始化計算
  calculate();
</script>

</body>
</html>
